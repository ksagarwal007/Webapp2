<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Spending bars of different heights for rent, fees, food and EMI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5FE0"/><stop offset="1" stop-color="#0B2A6B"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".35" r=".6"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="#FFFFFF" opacity=".08"><circle cx="190" cy="760" r="80"/><circle cx="1450" cy="740" r="64"/><circle cx="230" cy="160" r="46"/></g><rect x="520" y="620" width="600" height="10" rx="5" fill="#FFFFFF" opacity=".5"/><rect x="560" y="320" width="100" height="300" rx="14" fill="#FFD27A"/><text x="610" y="680" font-family="Arial" font-weight="700" font-size="30" fill="#FFFFFF" text-anchor="middle">Rent</text><rect x="700" y="360" width="100" height="260" rx="14" fill="#FFD27A"/><text x="750" y="680" font-family="Arial" font-weight="700" font-size="30" fill="#FFFFFF" text-anchor="middle">Fees</text><rect x="840" y="280" width="100" height="340" rx="14" fill="#FFFFFF"/><text x="890" y="680" font-family="Arial" font-weight="700" font-size="30" fill="#FFFFFF" text-anchor="middle">Food</text><rect x="980" y="560" width="100" height="60" rx="14" fill="#FFFFFF"/><text x="1030" y="680" font-family="Arial" font-weight="700" font-size="30" fill="#FFFFFF" text-anchor="middle">EMI</text>
</svg>
