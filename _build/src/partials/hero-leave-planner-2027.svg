<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A calendar with a nine-day break highlighted, a sun and an aeroplane">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5FE0"/><stop offset="1" stop-color="#0B2A6B"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".35" r=".6"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g fill="#FFFFFF" opacity=".08"><circle cx="180" cy="760" r="80"/><circle cx="1460" cy="760" r="60"/><circle cx="240" cy="150" r="44"/></g>
  <!-- sun -->
  <g transform="translate(1300 190)"><circle r="70" fill="#FFD27A"/><g stroke="#FFD27A" stroke-width="12" stroke-linecap="round"><path d="M0 -110 V-92 M0 92 V110 M-110 0 H-92 M92 0 H110 M-78 -78 L-65 -65 M65 65 L78 78 M-78 78 L-65 65 M65 -65 L78 -78"/></g></g>
  <!-- plane and trail -->
  <path d="M260 300 C 420 210, 560 230, 700 170" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round"/>
  <g transform="translate(740 150) rotate(-18)" fill="#FFFFFF"><path d="M-60 0 L60 -8 Q80 0 60 8 Z"/><path d="M0 -4 L-30 -50 L-12 -50 L30 -4 Z"/><path d="M0 4 L-30 50 L-12 50 L30 4 Z"/><path d="M-52 -2 L-66 -24 L-58 -24 L-40 -2 Z"/></g>
  <!-- calendar card -->
  <g transform="translate(330 300)">
    <rect width="940" height="520" rx="36" fill="#FFFFFF"/>
    <rect width="940" height="96" rx="36" fill="#0E1726"/><rect y="60" width="940" height="36" fill="#0E1726"/>
    <g fill="#FFFFFF"><rect x="200" y="-22" width="22" height="64" rx="11"/><rect x="718" y="-22" width="22" height="64" rx="11"/></g>
    <g transform="translate(46 130)">
      <!-- 7 columns x 4 rows of day tiles, 112 apart -->
      <g fill="#EEF2F8">
        <rect x="0" y="0" width="96" height="80" rx="16"/><rect x="128" y="0" width="96" height="80" rx="16"/><rect x="256" y="0" width="96" height="80" rx="16"/><rect x="384" y="0" width="96" height="80" rx="16"/><rect x="512" y="0" width="96" height="80" rx="16"/><rect x="640" y="0" width="96" height="80" rx="16"/><rect x="768" y="0" width="96" height="80" rx="16"/>
        <rect x="0" y="270" width="96" height="80" rx="16"/><rect x="128" y="270" width="96" height="80" rx="16"/><rect x="256" y="270" width="96" height="80" rx="16"/><rect x="384" y="270" width="96" height="80" rx="16"/><rect x="512" y="270" width="96" height="80" rx="16"/>
      </g>
      <!-- the 9-day break: weekend, leave, holiday, leave, leave, holiday, weekend... -->
      <rect x="640" y="90" width="96" height="80" rx="16" fill="#CDD6E3"/><rect x="768" y="90" width="96" height="80" rx="16" fill="#CDD6E3"/>
      <rect x="0" y="180" width="96" height="80" rx="16" fill="#F5B547"/><rect x="128" y="180" width="96" height="80" rx="16" fill="#1F5FE0"/><rect x="256" y="180" width="96" height="80" rx="16" fill="#F5B547"/>
      <rect x="384" y="180" width="96" height="80" rx="16" fill="#F5B547"/><rect x="512" y="180" width="96" height="80" rx="16" fill="#1F5FE0"/><rect x="640" y="180" width="96" height="80" rx="16" fill="#CDD6E3"/><rect x="768" y="180" width="96" height="80" rx="16" fill="#CDD6E3"/>
      <g fill="#EEF2F8"><rect x="0" y="90" width="96" height="80" rx="16"/><rect x="128" y="90" width="96" height="80" rx="16"/><rect x="256" y="90" width="96" height="80" rx="16"/><rect x="384" y="90" width="96" height="80" rx="16"/><rect x="512" y="90" width="96" height="80" rx="16"/></g>
      <!-- break outline -->
      <rect x="628" y="80" width="248" height="100" rx="24" fill="none" stroke="#0B7F5A" stroke-width="8"/>
      <rect x="-12" y="170" width="888" height="100" rx="24" fill="none" stroke="#0B7F5A" stroke-width="8"/>
    </g>
  </g>
</svg>
