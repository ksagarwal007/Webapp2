 <circle cx="570" cy="700" r="44" fill="#7FB0FF"/><text x="570" y="715" font-family="Arial" font-weight="700" font-size="36" fill="#0B2A6B" text-anchor="middle">58</text><circle cx="1030" cy="700" r="44" fill="#7FB0FF"/><text x="1030" y="715" font-family="Arial" font-weight="700" font-size="36" fill="#0B2A6B" text-anchor="middle">60</text>
